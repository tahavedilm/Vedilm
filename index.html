/* ===== payroll phase 2: monthly 100% capacity, backlog, swaps ===== */
function curPeriodJ(){const j=Cal.toJ(Cal.todayISO());return j.y+'-'+Cal.pad(j.m)}
const tW=x=>x.weight||10;
function capUsedC(pid,uid,period,exceptId){return db.tasks.filter(x=>x.projectId===pid&&x.id!==exceptId&&!x.backlog&&!x.extra&&x.period===period&&x.assigneeIds.includes(uid)).reduce((a,x)=>a+tW(x),0)}
function capBad(tk){
  if(tk.backlog||tk.extra)return '';const p=projById(tk.projectId),per=tk.period||curPeriodJ();
  for(const a of tk.assigneeIds){if(p&&a===p.ownerId)continue;if(capUsedC(tk.projectId,a,per,tk.id)+tW(tk)>100)return a}
  return '';
}
function swapsLeftC(p,a,per){return 3-((p.swaps||{})[a+':'+per]||0)}
function monthHours(pid,uid){
  const inv=db.invites.find(i=>i.status==='accepted'&&i.toId===uid&&i.offer&&(!i.projectId||i.projectId===pid))||db.invites.find(i=>i.status==='accepted'&&i.toId===uid&&i.offer);
  const o=inv&&inv.offer;if(!o)return 140;
  return o.hoursMode==='day'?(Math.round(o.dailyHours*o.workdays.length*52/12)||140):o.hoursMonth;
}
function pctHours(pid,uid,pct){const h=monthHours(pid,uid)*pct/100,hh=Math.floor(h),mm=Math.round((h-hh)*60);return t('cap.hours',{h:num(hh),m:num(mm)})}
/* returns false (and tells the user why) when the change would break the 100% rule or the swap limit */
function capGuard(obj,isNew){
  const p=projById(obj.projectId);if(!p||p.ownerId!==me().id)return true;
  const bad=capBad(obj);
  if(bad){toast(t('cap.over',{name:uname(bad)}));return false}
  const last=TM&&TM.last;
  if(!isNew&&last&&!last.backlog&&!last.extra&&obj.backlog){
    const need=(last.assigneeIds||[]).filter(a=>a!==p.ownerId),per=last.period||curPeriodJ();
    if(need.some(a=>swapsLeftC(p,a,per)<=0)){toast(t('cap.swapsOut'));return false}
    if(!SRV.on){p.swaps=p.swaps||{};need.forEach(a=>{p.swaps[a+':'+per]=(p.swaps[a+':'+per]||0)+1})}
  }
  return true;
}

/* pay-day markers for the calendar: green = paid, red = overdue, amber = upcoming */
function payItems(){
  if(!SRV.on||!me())return[];
  const u=me(),today=Cal.todayISO(),out=[],seen=new Set();
  const col=(due,st)=>st==='paid'||st==='settled'?'#1e9e5a':(due<today?'#d64545':'#e0a100');
  INVS.list.forEach(x=>{if(!x.due)return;seen.add(x.inviteId+':'+x.period);out.push({id:'pay:'+x.id,date:x.due,title:t('iv.payDay')+' · '+(u.role==='manager'?x.userName:jPeriodLabel(x.period)),time:'',note:'',color:col(x.due,x.status)})});
  const cur=Cal.toJ(today);const cp=cur.y+'-'+String(cur.m).padStart(2,'0');
  db.invites.filter(i=>i.status==='accepted'&&i.offer&&(i.toId===u.id||i.fromId===u.id)).forEach(i=>{
    if(seen.has(i.id+':'+cp))return;
    let y=cur.y,m=cur.m+1;if(m>12){m=1;y++}
    const due=Cal.fromJ(y,m,i.offer.payDay||10);
    out.push({id:'pay:'+i.id+':'+cp,date:due,title:t('iv.payDay')+' · '+(u.role==='manager'?((userById(i.toId)||{}).name||''):jPeriodLabel(cp)),time:'',note:'',color:col(due,'')});
  });
  return out;
}

/* ===== chat: project group channels + private direct messages ===== */
const CRK=()=>'vedilm_chatread_'+(getSid()||'');
function chatReadMap(){try{return JSON.parse(localStorage.getItem(CRK())||'{}')}catch(e){return {}}}
function chatMarkRead(sel,at){if(!sel||!at)return;const m=chatReadMap();if(m[sel]&&m[sel]>=at)return;m[sel]=at;try{localStorage.setItem(CRK(),JSON.stringify(m))}catch(e){}}
function msgSel(m){const u=me();return m.scope==='p'?'p:'+m.projectId:'d:'+(m.fromId===u.id?m.toId:m.fromId)}
function chatMsgs(sel){
  const u=me(),id=sel.slice(2);
  return db.messages.filter(m=>sel[0]==='p'?(m.scope==='p'&&m.projectId===id):(m.scope==='d'&&((m.fromId===u.id&&m.toId===id)||(m.fromId===id&&m.toId===u.id)))).sort((a,b)=>a.at.localeCompare(b.at)||a.id.localeCompare(b.id));
}
function chatPeerIds(){const u=me(),s=new Set(teamIds());db.invites.forEach(i=>{if(i.status!=='discussing')return;if(i.fromId===u.id)s.add(i.toId);else if(i.toId===u.id)s.add(i.fromId)});return [...s]}
function chatChannels(){
  const u=me(),rd=chatReadMap(),out=[];
  const add=(sel,title,sub,avatarHTML)=>{
    const ms=chatMsgs(sel),last=ms[ms.length-1],unread=ms.filter(m=>m.fromId!==u.id&&m.at>(rd[sel]||'')).length;
    out.push({sel,title,sub,av:avatarHTML,last,unread,kind:sel[0]});
  };
  visProjects().forEach(p=>add('p:'+p.id,p.name,t('chat.members',{n:num(projMemberIds(p).length)}),`<span class="pcol" style="background:${p.color};width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:800;flex:none">${esc(initials(p.name)[0])}</span>`));
  chatPeerIds().forEach(id=>{const o=userById(id);if(o)add('d:'+id,o.name,t('role.'+o.role),avatar(id))});
  return out;
}
function chatUnreadTotal(){try{return chatChannels().reduce((a,c)=>a+c.unread,0)}catch(e){return 0}}
function localDay(at){const d=new Date(at);return Cal.iso(d.getFullYear(),d.getMonth()+1,d.getDate())}
function localHM(at){const d=new Date(at);return Cal.pad(d.getHours())+':'+Cal.pad(d.getMinutes())}
function viewChat(){
  const u=me(),chans=chatChannels();
  if(ui.chat.sel&&!chans.some(c=>c.sel===ui.chat.sel))ui.chat.sel='';
  if(!ui.chat.sel&&innerWidth>900&&chans.length){const first=chans.filter(c=>c.last).sort((a,b)=>b.last.at.localeCompare(a.last.at))[0]||chans[0];ui.chat.sel=first.sel}
  const sel=ui.chat.sel,cur=chans.find(c=>c.sel===sel);
  const item=c=>`<button type="button" class="ch-i ${c.sel===sel?'on':''}" data-act="chat-open" data-sel="${c.sel}">${c.av}<span class="grow" style="min-width:0"><b class="ch-n">${esc(c.title)}</b><span class="xs muted ch-p">${c.last?esc((c.last.fromId===u.id?t('chat.you')+': ':c.kind==='p'?uname(c.last.fromId).split(/\s+/)[0]+': ':'')+c.last.text):esc(c.sub)}</span></span>${c.unread?`<span class="cnt">${num(Math.min(c.unread,99))}</span>`:''}</button>`;
  const groups=chans.filter(c=>c.kind==='p'),dms=chans.filter(c=>c.kind==='d');
  const side=`<aside class="ch-list card">
    <h4 class="ch-h">${esc(t('chat.projects'))}</h4>${groups.length?groups.map(item).join(''):`<p class="xs muted" style="padding:4px 10px">${esc(t('chat.noProjects'))}</p>`}
    <h4 class="ch-h">${esc(t('chat.direct'))}</h4>${dms.length?dms.map(item).join(''):`<p class="xs muted" style="padding:4px 10px">${esc(t('chat.noTeam'))}</p>`}</aside>`;
  let pane;
  if(!cur){pane=`<section class="ch-pane card">${emptyState('msg',t('chat.pick'),t('chat.pick.d'))}</section>`}
  else{
    const ms=chatMsgs(sel),isP=sel[0]==='p',p=isP?projById(sel.slice(2)):null,other=isP?null:userById(sel.slice(2));
    const memIds=isP?projMemberIds(p):[u.id,other.id];
    let html='',prevDay='',prevFrom='';
    ms.forEach(m=>{
      const day=localDay(m.at),own=m.fromId===u.id;
      if(day!==prevDay){html+=`<div class="ch-day"><span>${esc(fmtDate(day,calSys()))}</span></div>`;prevDay=day;prevFrom=''}
      const showName=isP&&!own&&prevFrom!==m.fromId;
      html+=`<div class="cm ${own?'own':''}">${!own&&isP?(showName?avatar(m.fromId,'sm'):'<span class="avatar sm" style="visibility:hidden"></span>'):''}<div class="bub">${showName?`<div class="who">${esc(uname(m.fromId))}</div>`:''}<div class="tx">${mentionize(m.text,memIds)}</div><div class="tm">${esc(fmtTime(localHM(m.at)))}${own?`<button type="button" class="cm-del" data-act="chat-del" data-id="${m.id}" aria-label="${esc(t('delete'))}" title="${esc(t('delete'))}">${ic('trash','sm')}</button>`:''}</div></div></div>`;
      prevFrom=m.fromId;
    });
    const head=isP?`<div class="ch-top"><button type="button" class="icon-btn ch-back" data-act="chat-back" aria-label="${esc(t('close'))}">${ic('chr','sm flip')}</button>${cur.av}<div class="grow"><b>${esc(p.name)}</b><div class="xs muted">${esc(t('chat.groupSub'))}</div></div>${avatarStack(memIds,4)}<a class="btn sm" href="#/app/project/${p.id}">${esc(t('nav.projects'))}</a></div>`
      :`<div class="ch-top"><button type="button" class="icon-btn ch-back" data-act="chat-back" aria-label="${esc(t('close'))}">${ic('chr','sm flip')}</button>${avatar(other.id)}<div class="grow"><b>${esc(other.name)}</b><div class="xs muted">${SRV.on&&SRV.online.has(other.id)?esc(t('chat.online')):esc(t('chat.private'))}</div></div><span class="badge">${ic('lock','sm')} ${esc(t('chat.private'))}</span></div>`;
    const showRep=isP&&ui.chatSub[sel]==='reports';
    if(showRep){pane=`<section class="ch-pane card">${head}${chatSubTabs(sel)}<div class="chat-msgs" id="chat-msgs">${reportsFeedHTML(sel.slice(2))}</div><p class="xs muted" style="padding:10px 14px;margin:0">${esc(t('dr.feedNote'))}</p></section>`}
    else pane=`<section class="ch-pane card">${head}${isP?chatSubTabs(sel):''}<div class="chat-msgs" id="chat-msgs">${html||`<p class="muted" style="text-align:center;margin:auto">${esc(t('chat.empty'))}</p>`}</div>
      <div class="ch-in"><textarea class="textarea" id="chat-in" rows="1" maxlength="2000" data-in="chat-draft" placeholder="${esc(t('chat.ph'))}" aria-label="${esc(t('chat.ph'))}">${esc(ui.chatDraft[sel]||'')}</textarea><button type="button" class="btn primary" data-act="chat-send">${ic('send','sm')}${esc(t('send'))}</button></div></section>`;
    if(document.visibilityState==='visible'&&ms.length)chatMarkRead(sel,ms[ms.length-1].at);
  }
  return pageHead(t('nav.chat'),t('chat.sub'))+`<div class="chat ${sel?'has-sel':''}">${side}${pane}</div>`;
}
let CSV=null;
function chatBefore(){const b=document.getElementById('chat-msgs');CSV=b?{sel:ui.chat.sel,top:b.scrollTop,bottom:b.scrollHeight-b.scrollTop-b.clientHeight<40}:null}

function chatSend(){
  const sel=ui.chat.sel,i=document.getElementById('chat-in');if(!sel||!i)return;
  const text=i.value.trim().slice(0,2000);if(!text)return;
  const u=me(),isP=sel[0]==='p',id=sel.slice(2);
  if(isP){const p=projById(id);if(!p||!projVisible(p))return}else if(!chatPeerIds().includes(id))return;
  const m={id:uid('m_'),scope:isP?'p':'d',projectId:isP?id:'',toId:isP?'':id,fromId:u.id,text,at:nowISO()};

}
function chatDelete(id){

/* ===== router, events, init ===== */
function parseRoute(){
  const parts=(location.hash.replace(/^#/,'')||'/').split('/').filter(Boolean);
  if(!parts.length)return{name:'landing'};
  if(['login','register','forgot','plans','rules'].includes(parts[0]))return{name:parts[0]};

  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName);

  if(e.key==='/'&&!typing&&me()&&parseRoute().app&&!ovStack.length){e.preventDefault();openCmdk();return}
  if(tg.id==='chat-in'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();chatSend();return}
  if(e.key.toLowerCase()==='n'&&!typing&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&isMgr()&&parseRoute().app&&!ovStack.length){e.preventDefault();openTask(null,{projectId:parseRoute().name==='project'?parseRoute().id:undefined});return}
  if(e.key==='Enter'&&!e.isComposing&&!e.shiftKey&&tg.tagName==='INPUT'&&!/^(checkbox|radio|submit|button|file)$/.test(tg.type)&&tg.id!=='ck'&&tg.id!=='chat-in'){
    const fm=tg.closest('form');
    if(fm){
      const fs=[...fm.querySelectorAll('input,select,textarea')].filter(x=>!x.disabled&&x.type!=='hidden'&&x.type!=='file'&&x.offsetParent!==null&&!(x.tagName==='INPUT'&&/^(checkbox|radio)$/.test(x.type)));
      const i=fs.indexOf(tg);
      if(fs.length>1&&i>=0&&i<fs.length-1){e.preventDefault();fs[i+1].focus();if(fs[i+1].select&&fs[i+1].tagName==='INPUT')try{fs[i+1].select()}catch(_){};return}
    }
  }
  if(tg.id==='ck'){
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();CK.i=clamp(CK.i+(e.key==='ArrowDown'?1:-1),0,Math.max(0,CK.items.length-1));renderCmdk()}

  else if(k==='chat-draft'){ui.chatDraft[ui.chat.sel]=el.value}
  else if(k==='money'){const h=el.parentElement.querySelector('.hint');if(h)h.textContent=el.value?fmtMoney(toNum(el.value)):''}
  else if(k==='ck'){}
});
document.addEventListener('input',e=>{if(e.target.id==='ck'){CK.q=e.target.value;CK.items=cmdItems(CK.q);CK.i=0;renderCmdk()}});

/* ---------- kanban drag & drop ---------- */
let DRAG=null,dropLine=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest?.('.kcard');if(!c)return;DRAG=c.dataset.id;c.classList.add('drag');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',DRAG)}catch(x){}});
document.addEventListener('dragend',()=>{DRAG=null;$$('.kcard.drag').forEach(x=>x.classList.remove('drag'));$$('.kcol.over').forEach(x=>x.classList.remove('over'));dropLine?.remove();dropLine=null});
function dropTarget(col,y){
  const cards=$$('.kcard:not(.drag)',col);
  for(const c of cards){const r=c.getBoundingClientRect();if(y<r.top+r.height/2)return c}
  return null;
}
document.addEventListener('dragover',e=>{
  const col=e.target.closest?.('.kcol');if(!col||!DRAG)return;e.preventDefault();e.dataTransfer.dropEffect='move';
  $$('.kcol.over').forEach(x=>{if(x!==col)x.classList.remove('over')});col.classList.add('over');
  if(!dropLine){dropLine=document.createElement('div');dropLine.className='drop-line'}
  const before=dropTarget(col,e.clientY);
  if(before)col.insertBefore(dropLine,before);else{const add=$('.kadd',col);add?col.insertBefore(dropLine,add):col.appendChild(dropLine)}
});
document.addEventListener('drop',e=>{
  const col=e.target.closest?.('.kcol');if(!col||!DRAG)return;e.preventDefault();
  const before=dropTarget(col,e.clientY);const id=DRAG;DRAG=null;
  moveTask(id,col.dataset.status,before?before.dataset.id:null);
});

/* ---------- sync across tabs ---------- */
window.addEventListener('storage',e=>{
  if(SRV.on)return;
  if(e.key===DBK){if(Date.now()-lastWrite<300)return;db=loadDB();if(ovStack.length)pendingSync=true;else render()}
  else if(e.key===SK&&!getSid()&&parseRoute().app)render();
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&me()&&!ovStack.length){if(SRV.on){pullState();if(!SRV.abort)connectSSE()}else{db=loadDB();render()}}});
window.addEventListener('pagehide',()=>{if(SRV.on&&SRV.base&&getTok()){const ch=computeChanges();if(ch.any)api('POST','/api/sync',{cid:SRV.cid,changes:ch.changes},{keepalive:true})}});

/* ---------- init ---------- */
(async function init(){
  applyLang();applyTheme();
  SRV.on=await detectServer();
  if(SRV.on){
    db=emptyDB();
    if(getTok()){
      const r=await api('GET','/api/state',undefined,{noAuthRedirect:true});
      if(r.ok){setSid(r.data.me,!!(()=>{try{return localStorage.getItem(TK)}catch(e){return ''}})());loadState(r.data);connectSSE()}
      else if(r.status===401){clearTok();clearSid()}
      else if(r.status===0)setConn('off')
    }else clearSid();
  }else{
    let has=false;try{has=localStorage.getItem(DBK)!==null}catch(e){}
    if(has)db=loadDB();else{try{migrateLegacy()}catch(e){db=emptyDB()}}
    if(!db)db=emptyDB();
  }
  const u=me();if(u&&u.prefs&&LANGIDX[u.prefs.lang]!=null&&u.prefs.lang!==LANG){LANG=u.prefs.lang;applyLang()}
  if(!location.hash)location.hash='#/';
  render();
  if(!SRV.on)upgradeLegacy();
})();
async function upgradeLegacy(){
  let ch=false;
  for(const u of db.users){if(!u.hash&&u.legacyPw!==undefined){u.hash=await hashSecret(String(u.legacyPw),u.salt);delete u.legacyPw;ch=true}}
  if(ch)save();
}


</script>
