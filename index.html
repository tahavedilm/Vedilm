<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>vedilm</title>
<meta name="description" content="vedilm — project management with Jalali and Gregorian calendar">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%236c4cf1'/%3E%3Cpath d='M16 7l2 6 6 2-6 2-2 6-2-6-6-2 6-2z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f6fb;--surface:#fff;--surface2:#f1f1f8;--ink:#16162a;--muted:#5f5f78;--line:#e4e4ef;
  --primary:#6c4cf1;--primary-d:#5638d6;--primary-soft:#eeeaff;--on-primary:#fff;
  --ok:#16a36a;--warn:#c98a0a;--bad:#d9405b;--info:#2f6fe4;
  --s-todo:#7d7d96;--s-doing:#2f6fe4;--s-review:#c98a0a;--s-done:#16a36a;
  --p-low:#16a36a;--p-med:#c98a0a;--p-high:#e0642a;--p-urgent:#d9405b;
  --shadow:0 1px 2px rgba(30,24,70,.06),0 8px 24px rgba(30,24,70,.06);
  --shadow-lg:0 24px 70px rgba(30,24,70,.22);
  --r:14px;--r-sm:9px;--sbw:248px;--tb:60px;
  --font:Vazirmatn,Inter,"Noto Sans SC",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#0e0e17;--surface:#171722;--surface2:#1f1f2d;--ink:#f1f1fa;--muted:#a3a3bb;--line:#2c2c3f;
  --primary:#8b72ff;--primary-d:#a08cff;--primary-soft:#2a2350;--on-primary:#12102a;
  --ok:#3ccf91;--warn:#f0b445;--bad:#ff7088;--info:#6ea2ff;
  --s-todo:#9a9ab3;--s-doing:#6ea2ff;--s-review:#f0b445;--s-done:#3ccf91;
  --p-low:#3ccf91;--p-med:#f0b445;--p-high:#ff8f57;--p-urgent:#ff7088;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);--shadow-lg:0 24px 70px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--primary)}
h1,h2,h3,h4{margin:0;line-height:1.35;font-weight:700}
p{margin:0}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:15px;height:15px}.ic.lg{width:22px;height:22px}
html[dir=rtl] .flip{transform:scaleX(-1)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 16px;border-radius:var(--r-sm);font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface);transition:background .15s,border-color .15s,transform .1s;white-space:nowrap}
.btn:hover{background:var(--surface2)}.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{background:var(--primary-d);border-color:var(--primary-d)}
.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:var(--surface2)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.btn.danger:hover{background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.btn.sm{min-height:32px;padding:4px 11px;font-size:13px}
.btn.lg{min-height:48px;padding:10px 24px;font-size:15px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon-btn{width:38px;height:38px;display:inline-grid;place-items:center;border-radius:var(--r-sm);color:var(--muted);position:relative}
.icon-btn:hover{background:var(--surface2);color:var(--ink)}

/* forms */
.field{display:grid;gap:6px;margin-bottom:14px}
.field>label,.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.input,.select,.textarea{width:100%;min-height:42px;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);transition:border-color .15s,box-shadow .15s}
.textarea{min-height:92px;resize:vertical;line-height:1.7}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 22%,transparent)}
.input.err{border-color:var(--bad)}
.field .msg{font-size:12.5px;color:var(--bad);min-height:0}
.field .hint{font-size:12.5px;color:var(--muted)}
.pw{position:relative}.pw .input{padding-inline-end:44px}
.pw button{position:absolute;inset-inline-end:4px;top:3px;width:36px;height:36px;display:grid;place-items:center;color:var(--muted);border-radius:8px}
.meter{display:flex;gap:4px;margin-top:2px}.meter i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.meter[data-s="1"] i:nth-child(1){background:var(--bad)}
.meter[data-s="2"] i:nth-child(-n+2){background:var(--warn)}
.meter[data-s="3"] i:nth-child(-n+3){background:var(--info)}
.meter[data-s="4"] i{background:var(--ok)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:10px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--primary)}
.switch{width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:inset-inline-start .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch[aria-checked=true]{background:var(--primary)}
.switch[aria-checked=true]::after{inset-inline-start:21px}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-h h3{font-size:16px}
.muted{color:var(--muted)}.small{font-size:13px}.xs{font-size:12px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:1px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted);line-height:1.8;white-space:nowrap}
.badge.primary{background:var(--primary-soft);color:var(--primary)}
.badge.ok{background:color-mix(in srgb,var(--ok) 16%,var(--surface));color:var(--ok)}
.badge.bad{background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:var(--bad)}
.badge.warn{background:color-mix(in srgb,var(--warn) 18%,var(--surface));color:var(--warn)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block;flex:none}
.avatar{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:700;color:#fff;background:var(--primary);flex:none;overflow:hidden;border:2px solid var(--surface)}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.lg{width:72px;height:72px;font-size:24px}.avatar.sm{width:24px;height:24px;font-size:10px}
.avatars{display:flex}.avatars .avatar+.avatar{margin-inline-start:-8px}
.progress{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.progress>i{display:block;height:100%;border-radius:99px;background:var(--primary);transition:width .4s}
.empty{text-align:center;padding:44px 20px;display:grid;gap:10px;justify-items:center}
.empty .eico{width:64px;height:64px;border-radius:20px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center}
.empty h3{font-size:17px}.empty p{color:var(--muted);max-width:420px}
.skeleton{background:linear-gradient(90deg,var(--surface2),var(--line),var(--surface2));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:8px}
@keyframes sk{to{background-position:-200% 0}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{padding:10px 14px;color:var(--muted);font-weight:600;font-size:14px;border-bottom:2px solid transparent;white-space:nowrap;display:inline-flex;gap:7px;align-items:center}
.tabs button[aria-selected=true]{color:var(--primary);border-color:var(--primary)}
.seg{display:inline-flex;background:var(--surface2);border-radius:var(--r-sm);padding:3px;gap:2px}
.seg button{padding:5px 12px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:7px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted)}

/* ============ Landing ============ */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.wrap{width:min(1120px,calc(100% - 32px));margin-inline:auto}
.nav{height:66px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.01em}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center}
.nav .links{display:flex;gap:6px;margin-inline-start:12px}
.nav .links a{padding:6px 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-size:14px;font-weight:500}
.nav .links a:hover{color:var(--ink);background:var(--surface2)}
.nav .sp{flex:1}
.hero{padding:72px 0 56px;display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:center}
.hero h1{font-size:clamp(34px,5.2vw,56px);line-height:1.2;letter-spacing:-.02em;font-weight:800}
.hero .lead{font-size:18px;color:var(--muted);margin:18px 0 28px;max-width:520px}
.hero .micro{margin-top:14px;color:var(--muted);font-size:13px}
.pill{display:inline-flex;gap:8px;align-items:center;padding:4px 14px;border-radius:99px;background:var(--primary-soft);color:var(--primary);font-weight:600;font-size:13px;margin-bottom:18px}
.mock{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);overflow:hidden;direction:ltr}
.mock .bar{display:flex;gap:6px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface2)}
.mock .bar i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.mock .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px}
.mock .col h6{margin:0 0 8px;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.mock .tk{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:8px;font-size:12.5px;line-height:1.5}
.mock .tk small{display:flex;justify-content:space-between;margin-top:6px;color:var(--muted);font-size:11px}
.sec{padding:64px 0}
.sec h2{font-size:clamp(26px,3.6vw,36px);letter-spacing:-.01em}
.sec .lead{color:var(--muted);margin-top:10px;max-width:620px}
.sec.center{text-align:center}.sec.center .lead{margin-inline:auto}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:36px;text-align:start}
.feat .card{padding:22px}
.feat .fi{width:42px;height:42px;border-radius:12px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;margin-bottom:14px}
.feat h3{font-size:17px;margin-bottom:6px}.feat p{color:var(--muted);font-size:14.5px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.cal-demo{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;direction:ltr}
.cal-demo b{font-size:11px;color:var(--muted);text-align:center;font-weight:600}
.cal-demo span{aspect-ratio:1;display:grid;place-items:center;border-radius:8px;font-size:12px;background:var(--surface2);position:relative}
.cal-demo span.t{background:var(--primary);color:var(--on-primary);font-weight:700}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:36px;text-align:start}
.plan{display:flex;flex-direction:column;gap:14px}
.plan.pop{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary),var(--shadow)}
.plan .price{font-size:38px;font-weight:800}
.plan ul{list-style:none;padding:0;margin:0;display:grid;gap:9px;flex:1;font-size:14.5px}
.plan li{display:flex;gap:9px;align-items:flex-start}.plan li .ic{color:var(--ok);margin-top:5px}
.faq{max-width:720px;margin:32px auto 0;text-align:start}
.faq details{border-bottom:1px solid var(--line);padding:16px 2px}
.faq summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:20px;color:var(--muted)}
.faq details[open] summary::after{content:"−"}
.faq p{color:var(--muted);margin-top:8px}
.cta{background:var(--primary);color:var(--on-primary);border-radius:24px;padding:52px 28px;text-align:center}
.cta .btn{background:#fff;color:#2a1c80;border-color:#fff;margin-top:22px}
.cta p{opacity:.85;margin-top:8px}
.foot{border-top:1px solid var(--line);padding:40px 0;margin-top:48px}
.foot .cols{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:28px}
.foot h4{font-size:14px;margin-bottom:10px}.foot a{display:block;color:var(--muted);text-decoration:none;font-size:14px;padding:3px 0}
.foot a:hover{color:var(--primary)}
.foot .copy{margin-top:28px;color:var(--muted);font-size:13px}

/* ============ Auth ============ */
.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.auth-side{background:linear-gradient(160deg,#5a3ee0,#2a1c80);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between}
.auth-side blockquote{margin:0;font-size:22px;line-height:1.6;font-weight:600;max-width:420px}
.auth-main{display:grid;place-items:center;padding:32px 20px}
.auth-box{width:min(420px,100%)}
.auth-box h1{font-size:28px;margin-bottom:6px}
.auth-box .sub{color:var(--muted);margin-bottom:24px}
.auth-box .alt{text-align:center;margin-top:18px;color:var(--muted);font-size:14px}
.auth-box .alt button{color:var(--primary);font-weight:600}
.role-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.role-pick label{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;cursor:pointer;display:grid;gap:2px;background:var(--surface)}
.role-pick input{position:absolute;opacity:0}
.role-pick label:has(input:checked){border-color:var(--primary);background:var(--primary-soft)}
.role-pick label:has(input:focus-visible){outline:2px solid var(--primary);outline-offset:2px}
.role-pick b{font-size:14px}.role-pick span{font-size:12.5px;color:var(--muted);line-height:1.5}

/* ============ App shell ============ */
.shell{display:grid;grid-template-columns:var(--sbw) 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--surface);border-inline-end:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.side .brand{padding:6px 10px 16px}
.nav-i{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:var(--r-sm);color:var(--muted);font-weight:600;font-size:14.5px;text-decoration:none;width:100%;text-align:start}
.nav-i:hover{background:var(--surface2);color:var(--ink)}
.nav-i[aria-current=page]{background:var(--primary-soft);color:var(--primary)}
.nav-i .cnt{margin-inline-start:auto;font-size:12px;background:var(--bad);color:#fff;border-radius:99px;padding:0 7px;line-height:1.6}
.side .sp{flex:1}
.side-user{display:flex;gap:10px;align-items:center;padding:10px;border-radius:var(--r-sm);border:1px solid var(--line)}
.side-user .nm{font-weight:700;font-size:14px;line-height:1.3}
.main{min-width:0;display:flex;flex-direction:column}
.appbar{position:sticky;top:0;z-index:30;height:var(--tb);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 24px}
.search-btn{display:flex;align-items:center;gap:10px;min-width:260px;max-width:380px;flex:1;padding:7px 12px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);color:var(--muted);font-size:14px}
.search-btn kbd{margin-inline-start:auto;font:inherit;font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 6px;background:var(--surface2)}
.content{padding:26px 24px 56px;width:100%;max-width:1320px;margin-inline:auto}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.ph h1{font-size:26px}.ph p{color:var(--muted);margin-top:2px}
.crumbs{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:6px}
.crumbs a{color:var(--muted);text-decoration:none}.crumbs a:hover{color:var(--primary)}
.mnav{display:none}
.menu-btn{display:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{padding:16px 18px}
.stat small{color:var(--muted);font-weight:600;display:flex;gap:7px;align-items:center}
.stat b{font-size:30px;line-height:1.3;display:block;margin-top:4px}
.stat.warnc b{color:var(--bad)}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.pcard{display:grid;gap:12px;cursor:pointer;transition:transform .15s,border-color .15s;position:relative}
.pcard:hover{transform:translateY(-2px);border-color:var(--primary)}
.pcard .pc-top{display:flex;gap:12px;align-items:flex-start}
.pcard .pcol{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none;font-weight:800}
.pcard h3{font-size:16px}
.pcard .desc{color:var(--muted);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:3em}
.list{display:grid}
.li{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li.click{cursor:pointer}.li.click:hover{background:var(--surface2)}
.li .t{font-weight:600;font-size:14.5px;line-height:1.5}
.cbx{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent;transition:.15s}
.cbx:hover{border-color:var(--primary)}
.cbx.on{background:var(--ok);border-color:var(--ok);color:#fff}
.due{display:inline-flex;gap:5px;align-items:center;font-size:12.5px;color:var(--muted);white-space:nowrap}
.due.over{color:var(--bad);font-weight:600}.due.today{color:var(--warn);font-weight:600}
.pr{display:inline-flex;gap:5px;align-items:center;font-size:12px;font-weight:600}
.pr .ic{width:13px;height:13px}
.pr.low{color:var(--p-low)}.pr.medium{color:var(--p-med)}.pr.high{color:var(--p-high)}.pr.urgent{color:var(--p-urgent)}
.tbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.tbar .input,.tbar .select{width:auto;min-height:38px;padding:5px 10px;font-size:14px}
.tbar .sp{flex:1}
.searchbox{position:relative}.searchbox .ic{position:absolute;inset-inline-start:11px;top:11px;color:var(--muted)}
.searchbox .input{padding-inline-start:36px;min-width:200px}

/* kanban */
.board{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:14px;overflow-x:auto;padding-bottom:12px;align-items:start}
.kcol{background:var(--surface2);border-radius:var(--r);padding:10px;min-height:140px;transition:background .15s,outline-color .15s;outline:2px dashed transparent;outline-offset:-2px}
.kcol.over{outline-color:var(--primary);background:var(--primary-soft)}
.kcol h4{font-size:13.5px;display:flex;align-items:center;gap:8px;padding:4px 6px 10px}
.kcol h4 .n{margin-inline-start:auto;font-weight:600;color:var(--muted);font-size:12.5px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:9px;cursor:grab;display:grid;gap:9px;box-shadow:var(--shadow);position:relative}
.kcard:hover{border-color:var(--primary)}
.kcard.drag{opacity:.4}
.kcard .kt{font-weight:600;font-size:14.5px;line-height:1.5;word-break:break-word}
.kcard .km{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.kcard .mv{position:absolute;inset-inline-end:6px;top:6px}
.kadd{width:100%;padding:8px;border-radius:9px;color:var(--muted);font-weight:600;font-size:13.5px;display:flex;gap:6px;align-items:center;justify-content:center}
.kadd:hover{background:var(--surface);color:var(--primary)}
.drop-line{height:3px;background:var(--primary);border-radius:3px;margin:-5px 0 5px}
.labels{display:flex;gap:5px;flex-wrap:wrap}
.lab{font-size:11.5px;padding:0 8px;border-radius:99px;background:var(--primary-soft);color:var(--primary);font-weight:600;line-height:1.7}

/* table-ish list view */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12.5px;color:var(--muted);font-weight:600;text-align:start;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14px}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--surface2)}
.scroll-x{overflow-x:auto}

/* modal / drawer */
.ov{position:fixed;inset:0;background:rgba(10,8,30,.5);z-index:100;display:grid;place-items:center;padding:16px;animation:fade .15s;overflow-y:auto}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border-radius:18px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:var(--shadow-lg);animation:pop .18s;display:flex;flex-direction:column}
@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}}
.modal.wide{width:min(860px,100%)}
.modal.sm{width:min(420px,100%)}
.mh{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.mh h2{font-size:18px;flex:1}
.mb{padding:20px 22px}
.mf{display:flex;gap:10px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.tgrid{display:grid;grid-template-columns:1.5fr 1fr;gap:0}
.tgrid>.l{padding:20px 22px;border-inline-end:1px solid var(--line)}
.tgrid>.r{padding:20px 22px;background:var(--surface2)}
.title-in{font-size:20px;font-weight:700;border:0;background:transparent;width:100%;padding:6px 0;border-bottom:2px solid transparent}
.title-in:focus{outline:none;border-color:var(--primary)}
.sub-i{display:flex;align-items:center;gap:10px;padding:5px 0}
.sub-i input[type=text]{flex:1;border:0;background:transparent;border-bottom:1px solid transparent;padding:4px 0}
.sub-i input[type=text]:focus{outline:none;border-color:var(--primary)}
.sub-i.done input[type=text]{text-decoration:line-through;color:var(--muted)}
.cmt{display:flex;gap:10px;margin-bottom:14px}
.cmt .b{background:var(--surface2);border-radius:12px;padding:8px 12px;flex:1}
.cmt .b b{font-size:13.5px}
.mention{color:var(--primary);font-weight:700}
.pick{display:flex;gap:6px;flex-wrap:wrap}
.pick label{cursor:pointer}
.pick input{position:absolute;opacity:0}
.pick span{display:inline-flex;gap:6px;align-items:center;padding:4px 11px;border-radius:99px;border:1px solid var(--line);font-size:13px;font-weight:600;background:var(--surface)}
.pick input:checked+span{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.pick input:focus-visible+span{outline:2px solid var(--primary);outline-offset:2px}
.meta-row{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center;margin-bottom:12px}
.meta-row>span{font-size:13px;color:var(--muted);font-weight:600}

/* toast */
.toasts{position:fixed;inset-inline:0;bottom:20px;z-index:300;display:grid;gap:8px;justify-items:center;pointer-events:none;padding:0 12px}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;box-shadow:var(--shadow-lg);display:flex;gap:14px;align-items:center;pointer-events:auto;animation:pop .2s;max-width:min(520px,100%);font-size:14px}
.toast button{color:var(--primary-d);font-weight:700;filter:brightness(1.3)}
:root:not([data-theme=dark]) .toast button{color:#b9a8ff}

/* dropdown */
.dd{position:absolute;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);min-width:200px;padding:6px;animation:pop .14s}
.dd button,.dd a{display:flex;gap:10px;align-items:center;width:100%;padding:8px 10px;border-radius:8px;font-size:14px;text-align:start;text-decoration:none;color:var(--ink)}
.dd button:hover,.dd a:hover{background:var(--surface2)}
.dd hr{border:0;border-top:1px solid var(--line);margin:5px 0}
.notif-p{inset-inline-end:0;top:46px;width:min(380px,92vw);padding:0}
.notif-p .hd{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.notif-p .body{max-height:420px;overflow:auto}
.nt{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:start;align-items:flex-start}
.nt:hover{background:var(--surface2)}
.nt.unread{background:color-mix(in srgb,var(--primary) 7%,var(--surface))}
.nt .nd{width:8px;height:8px;border-radius:50%;background:var(--primary);margin-top:9px;flex:none}
.nt.read .nd{visibility:hidden}
.bell-n{position:absolute;top:3px;inset-inline-end:3px;background:var(--bad);color:#fff;font-size:10.5px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;font-weight:700;padding:0 4px;line-height:1}

/* command palette */
.cmdk{width:min(620px,100%);align-self:start;margin-top:12vh;background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lg);overflow:hidden;animation:pop .15s}
.cmdk input{width:100%;border:0;padding:16px 18px;font-size:16px;background:transparent;border-bottom:1px solid var(--line)}
.cmdk input:focus{outline:none}
.cmdk .res{max-height:50vh;overflow:auto;padding:6px}
.cmdk .grp{font-size:12px;font-weight:700;color:var(--muted);padding:8px 10px 4px}
.cmdk button{display:flex;gap:12px;align-items:center;width:100%;padding:9px 10px;border-radius:9px;text-align:start}
.cmdk button[aria-selected=true]{background:var(--primary-soft);color:var(--primary)}

/* ============ Calendar ============ */
.calwrap{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
.cal-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.cal-h h2{font-size:21px;min-width:170px}
.cal-h .sel{width:auto;min-height:36px;padding:3px 10px;font-size:14px}
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--line);gap:1px}
.cgrid .wd{background:var(--surface2);text-align:center;font-size:12.5px;font-weight:700;color:var(--muted);padding:8px 2px}
.cgrid .wd.fri{color:var(--bad)}
.cell{background:var(--surface);min-height:104px;padding:6px;display:flex;flex-direction:column;gap:3px;text-align:start;cursor:pointer;position:relative;min-width:0;transition:background .12s}
.cell:hover{background:var(--surface2)}
.cell.out{background:color-mix(in srgb,var(--surface2) 70%,var(--surface));color:var(--muted)}
.cell.out .dn{opacity:.55}
.cell.dis{cursor:default;opacity:.4;pointer-events:none}
.cell .top{display:flex;justify-content:space-between;align-items:flex-start;gap:4px}
.cell .dn{font-weight:700;font-size:15px;width:28px;height:28px;display:grid;place-items:center;border-radius:50%}
.cell .alt{font-size:10.5px;color:var(--muted);padding-top:3px}
.cell.today .dn{background:var(--primary);color:var(--on-primary)}
.cell.sel{box-shadow:inset 0 0 0 2px var(--primary)}
.cell.hol .dn,.cell.fri .dn{color:var(--bad)}
.cell.today.hol .dn,.cell.today.fri .dn{color:var(--on-primary)}
.cell .hn{font-size:10.5px;color:var(--bad);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev{display:flex;align-items:center;gap:5px;font-size:11.5px;padding:1px 6px;border-radius:5px;line-height:1.55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:color-mix(in srgb,var(--c,var(--primary)) 15%,var(--surface));color:var(--ink);border-inline-start:3px solid var(--c,var(--primary));width:100%}
.ev.done{opacity:.55;text-decoration:line-through}
.ev span{overflow:hidden;text-overflow:ellipsis}
.more{font-size:11px;color:var(--primary);font-weight:700;padding:0 4px}
.cell .cntb{display:none}
.daypanel{position:sticky;top:calc(var(--tb) + 16px)}
.daypanel .dd1{font-size:20px;font-weight:800}
.agenda-i{display:flex;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;border-inline-start:4px solid var(--c,var(--primary));background:var(--surface)}
.agenda-i:hover{background:var(--surface2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;background:var(--c)}

/* datepicker */
.dp{position:relative}
.dp-pop{z-index:400;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:12px;width:292px;animation:pop .14s}
.dp-pop.up{top:auto;bottom:calc(100% + 6px)}
.dp-h{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.dp-h .sel{width:auto;min-height:32px;padding:2px 6px;font-size:13px}
.dp-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.dp-g b{font-size:11px;color:var(--muted);padding:4px 0}
.dp-g button{aspect-ratio:1;border-radius:8px;font-size:13px;display:grid;place-items:center;font-weight:600}
.dp-g button:hover:not([disabled]){background:var(--surface2)}
.dp-g button.o{color:var(--muted);opacity:.55}
.dp-g button.t{box-shadow:inset 0 0 0 1.5px var(--primary)}
.dp-g button.s{background:var(--primary);color:var(--on-primary)}
.dp-g button[disabled]{opacity:.22;cursor:default}
.dp-f{display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}

/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.chart .gl{stroke:var(--line);stroke-width:1}
.donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.lg-i{display:flex;align-items:center;gap:8px;font-size:13.5px}
.lg-i i{width:10px;height:10px;border-radius:3px}
.ctip{position:fixed;z-index:200;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:8px;font-size:12.5px;pointer-events:none;box-shadow:var(--shadow-lg);white-space:nowrap}
.bar-h{display:grid;grid-template-columns:130px 1fr 48px;gap:10px;align-items:center;font-size:13.5px;margin-bottom:10px}
.bar-h .progress{height:10px}
.act{display:flex;gap:10px;padding:8px 0;font-size:14px}
.act .ad{width:8px;height:8px;border-radius:50%;background:var(--primary);margin-top:9px;flex:none}

@media (max-width:1100px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .two,.calwrap{grid-template-columns:1fr}
  .daypanel{position:static}
}
@media (max-width:900px){
  .hero,.split,.auth{grid-template-columns:1fr}
  .hero{padding-top:36px}.auth-side{display:none}
  .feat,.plans{grid-template-columns:1fr}
  .foot .cols{grid-template-columns:1fr 1fr}
  .nav .links{display:none}
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset-block:0;inset-inline-start:0;width:280px;z-index:90;transform:translateX(-105%);transition:transform .22s;box-shadow:var(--shadow-lg)}
  html[dir=rtl] .side{transform:translateX(105%)}
  .side.open,html[dir=rtl] .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(10,8,30,.45);z-index:80}
  .menu-btn{display:inline-grid}
  .appbar{padding:0 12px}
  .content{padding:18px 14px 96px}
  .search-btn{min-width:0}.search-btn kbd,.search-btn .tx{display:none}.search-btn{flex:none;width:38px;height:38px;padding:0;justify-content:center;border:0;background:transparent}
  .mnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;inset-inline:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .mnav a{display:grid;justify-items:center;gap:1px;font-size:11px;color:var(--muted);text-decoration:none;padding:4px;font-weight:600}
  .mnav a[aria-current=page]{color:var(--primary)}
  .tgrid{grid-template-columns:1fr}.tgrid>.l{border-inline-end:0}
  .board{grid-template-columns:repeat(4,82vw)}
  .toasts{bottom:80px}
}
@media (max-width:640px){
  .grid2{grid-template-columns:1fr}
  .cell{min-height:64px;padding:3px}
  .cell .alt,.cell .hn{display:none}
  .cell .dn{width:24px;height:24px;font-size:13px}
  .cell .ev{display:none}
  .cell .cntb{display:flex;gap:2px;flex-wrap:wrap;margin-top:auto}
  .cell .cntb i{width:6px;height:6px;border-radius:50%;background:var(--c)}
  .stats{gap:10px}.stat b{font-size:24px}
  .bar-h{grid-template-columns:90px 1fr 40px}
  .ph h1{font-size:22px}
  .mock .cols{grid-template-columns:repeat(2,1fr)}.mock .col:nth-child(3){display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media print{
  .side,.appbar,.mnav,.ph .btn,.tbar,.toasts,.noprint{display:none!important}
  .shell{display:block}.content{padding:0;max-width:none}
  body{background:#fff;color:#000}.card{box-shadow:none;break-inside:avoid}
}

.cgrid .wd .ws{display:none}
@media (max-width:640px){.cgrid .wd .wl{display:none}.cgrid .wd .ws{display:inline}}

a.btn,a.brand,a.nav-i,.mnav a{text-decoration:none}

/* mobile refinements */
body{overflow-x:clip}
@media (max-width:900px){.tgrid>.r{order:-1;border-bottom:1px solid var(--line)}}
@media (max-width:640px){
  .nav{gap:8px}.nav>.btn.ghost{display:none}
  .nav .select{padding-inline:6px;font-size:13px;max-width:92px}
  .nav .btn.primary{padding:6px 12px;min-height:36px;font-size:13px}
  .brand{font-size:18px}
  .hero{padding-top:28px}
}

/* server mode & new features */
#conn{position:fixed;inset-block-end:16px;inset-inline-start:16px;z-index:200;background:var(--text);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg,0 8px 24px #0004)}
.avatar{position:relative;overflow:visible}.avatar img{border-radius:50%}
.pdot{position:absolute;inset-block-end:-1px;inset-inline-end:-1px;width:10px;height:10px;border-radius:50%;background:#16a36a;border:2px solid var(--surface)}
.avatar.sm .pdot{width:8px;height:8px}
.tl-card{padding:0;overflow:hidden}.tl-scroll{overflow-x:auto}
.tl{--namew:190px;min-width:calc(var(--namew) + var(--n)*var(--w));position:relative}
.tl-row{display:flex;align-items:center;border-bottom:1px solid var(--line);min-height:40px}
.tl-hd{position:sticky;top:0;background:var(--surface);z-index:2}
.tl-name{width:var(--namew);flex:none;padding:6px 12px;display:flex;gap:8px;align-items:center;text-align:start;position:sticky;inset-inline-start:0;background:var(--surface);z-index:1;border-inline-end:1px solid var(--line);min-height:40px}
.tl-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px;font-weight:600}.tl-t.done{text-decoration:line-through;color:var(--muted)}
.tl-track{position:relative;flex:1;height:40px;background-image:repeating-linear-gradient(to right,transparent 0,transparent calc(var(--w) - 1px),var(--line) calc(var(--w) - 1px),var(--line) var(--w))}
[dir=rtl] .tl-track{background-image:repeating-linear-gradient(to left,transparent 0,transparent calc(var(--w) - 1px),var(--line) calc(var(--w) - 1px),var(--line) var(--w))}
.tl-tick{position:absolute;top:6px;font-size:11px;color:var(--muted);white-space:nowrap;padding-inline-start:4px}
.tl-bar{position:absolute;top:9px;height:22px;border-radius:7px;background:var(--s-todo);color:#fff;display:flex;align-items:center;padding-inline:4px;overflow:hidden;box-shadow:0 1px 2px #0003}
.tl-bar.s-doing{background:var(--s-doing)}.tl-bar.s-review{background:var(--s-review)}.tl-bar.s-done{background:var(--s-done)}.tl-bar.over{background:var(--bad)}
.tl-bar .avatar{width:16px;height:16px;font-size:8px;border-width:1px}
.tl-body{position:relative}
.tl-today{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);opacity:.7;pointer-events:none;z-index:1}

/* tasks advance + chat */
.adv{padding:3px 8px;font-size:12px;gap:4px;min-height:28px}
.chat{display:grid;grid-template-columns:300px 1fr;gap:16px;height:calc(100vh - 190px);min-height:420px}
.ch-list{padding:10px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.ch-h{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:10px 10px 4px}
.ch-i{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;text-align:start;width:100%}
.ch-i:hover{background:var(--surface-2,var(--line))}.ch-i.on{background:color-mix(in srgb,var(--primary) 12%,transparent)}
.ch-n,.ch-p{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-pane{display:flex;flex-direction:column;padding:0;overflow:hidden;min-width:0}
.ch-top{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.ch-back{display:none}
.chat-msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:6px}
.ch-day{text-align:center;margin:10px 0 4px}.ch-day span{font-size:12px;color:var(--muted);background:var(--bg);padding:2px 10px;border-radius:99px;border:1px solid var(--line)}
.cm{display:flex;gap:8px;align-items:flex-end;max-width:78%}.cm.own{align-self:flex-end;flex-direction:row-reverse}
.bub{background:var(--surface-2,var(--line));padding:8px 12px;border-radius:14px;min-width:0}
.cm.own .bub{background:var(--primary);color:#fff}
.bub .who{font-size:12px;font-weight:700;color:var(--primary);margin-bottom:2px}
.bub .tx{white-space:pre-wrap;word-break:break-word;font-size:14.5px}
.bub .tm{font-size:11px;opacity:.7;margin-top:2px;display:flex;gap:6px;align-items:center;justify-content:flex-end}
.cm-del{opacity:0;color:inherit;display:inline-grid}.cm:hover .cm-del,.cm-del:focus-visible{opacity:1}
.cm.own .mention{background:#fff3;color:#fff}
.ch-in{display:flex;gap:10px;padding:12px;border-top:1px solid var(--line);align-items:flex-end}
.ch-in .textarea{min-height:44px;max-height:120px;resize:none}
@media(max-width:900px){.chat{grid-template-columns:1fr;height:calc(100vh - 220px)}.chat.has-sel .ch-list{display:none}.chat:not(.has-sel) .ch-pane{display:none}.ch-back{display:inline-grid}}

.plans.two{grid-template-columns:repeat(2,1fr);max-width:760px;margin-inline:auto}
@media (max-width:900px){.plans.two{grid-template-columns:1fr}}

</style>

<body>
<div id="root"></div>
<noscript><p style="padding:40px;text-align:center">JavaScript is required / برای استفاده از vedilm جاوااسکریپت لازم است.</p></noscript>
<script>
/* ===== Calendar math: Gregorian <-> Jalali (Solar Hijri) ===== */
const Cal=(()=>{
  const div=(a,b)=>Math.trunc(a/b), mod=(a,b)=>a-Math.trunc(a/b)*b;

      const proj={id:p.id?String(p.id):uid('p_'),ownerId:owner.id,name:String(p.name),desc:String(p.description||p.desc||''),color:PCOLORS[pi%PCOLORS.length],due:'',members:[],createdAt:nowISO()};
      (p.members||[]).forEach(m=>{const uu=db.users.find(x=>x.name===(m.name||m));if(uu&&uu.id!==owner.id)proj.members.push({userId:uu.id,title:String(m.role||'')})});
      db.projects.push(proj);

      });
    });
  }

}

const uname=id=>{const u=userById(id);return u?u.name:t('user.deleted')};
const initials=n=>{const p=String(n||'?').trim().split(/\s+/);return ((p[0]||'?')[0]+((p[1]||'')[0]||'')).toUpperCase()};
const avColor=id=>AV_COLORS[[...String(id)].reduce((a,c)=>a+c.charCodeAt(0),0)%AV_COLORS.length];
function avatar(id,cls=''){const u=userById(id);if(!u)return `<span class="avatar ${cls}" style="background:#999">?</span>`;
  return `<span class="avatar ${cls}" style="background:${avColor(u.id)}" title="${esc(u.name)}">${u.avatar?`<img alt="" src="${esc(u.avatar)}">`:esc(initials(u.name))}${typeof SRV!=='undefined'&&SRV.on&&SRV.online.has(u.id)?'<i class="pdot"></i>':''}</span>`}
function avatarStack(ids,max=4){const a=ids.slice(0,max).map(i=>avatar(i,'sm')).join('');const r=ids.length-max;return `<span class="avatars">${a}${r>0?`<span class="avatar sm" style="background:var(--muted)">+${r}</span>`:''}</span>`}

/* ---------- domain helpers ---------- */
function prefs(){const u=me();return Object.assign({calSys:null,weekStart:'auto',nAssigned:true,nDue:true,nComment:true},u&&u.prefs||{})}
function projVisible(p,u=me()){return !!u&&(p.ownerId===u.id||p.members.some(m=>m.userId===u.id))}
const visProjects=()=>db.projects.filter(p=>projVisible(p));
const projById=id=>db.projects.find(p=>p.id===id)||null;
const taskById=id=>db.tasks.find(x=>x.id===id)||null;
const projTasks=pid=>db.tasks.filter(x=>x.projectId===pid&&!x.backlog);
const projBacklog=pid=>db.tasks.filter(x=>x.projectId===pid&&x.backlog);
const visTasks=()=>{const ids=new Set(visProjects().filter(p=>!(p.locked&&me()&&p.ownerId===me().id)).map(p=>p.id));return db.tasks.filter(x=>ids.has(x.projectId))};
const myTasks=()=>{const u=me();return visTasks().filter(x=>x.assigneeIds.includes(u.id)&&!x.backlog)};
const projMemberIds=p=>[p.ownerId,...p.members.map(m=>m.userId)].filter((v,i,a)=>v&&a.indexOf(v)===i&&userById(v));
const progressOf=pid=>{const ts=projTasks(pid);return ts.length?Math.round(ts.filter(x=>x.status==='done').length/ts.length*100):0};
const canEditProject=p=>{const u=me();return !!u&&!!p&&p.ownerId===u.id};
const canEditTask=tk=>{const p=projById(tk.projectId);return !!p&&canEditProject(p)};
const canUpdateTask=tk=>{const u=me();const p=projById(tk.projectId);return !!u&&!!p&&(canEditProject(p)||tk.assigneeIds.includes(u.id))};
function teamIds(u=me()){ // accepted connections
  const s=new Set();db.invites.forEach(i=>{if(i.status!=='accepted')return;if(i.fromId===u.id)s.add(i.toId);else if(i.toId===u.id)s.add(i.fromId)});
  return [...s].filter(userById);
}
function logAct(projectId,text){db.activity.push({id:uid('a_'),projectId,userId:me()?.id||'',text,at:nowISO()});if(db.activity.length>600)db.activity.splice(0,db.activity.length-600)}
function notify(userId,o){
  if(!userId||!userById(userId))return;
  if(o.key&&db.notifs.some(n=>n.userId===userId&&n.key===o.key))return;
  const u=userById(userId),pf=Object.assign({nAssigned:true,nDue:true,nComment:true},u.prefs||{});
  if((o.type==='assigned'&&!pf.nAssigned)||(o.type==='due'&&!pf.nDue)||((o.type==='comment'||o.type==='mention')&&!pf.nComment))return;
  db.notifs.push({id:uid('n_'),userId,type:o.type,text:o.text,link:o.link||'',key:o.key||'',at:nowISO(),read:false,params:o.params||null});
  if(db.notifs.length>800)db.notifs.splice(0,db.notifs.length-800);
}
function checkDueNotifs(){
  const u=me();if(!u)return;const today=Cal.todayISO();let ch=false;
  myTasks().forEach(tk=>{
    if(tk.status==='done'||!tk.due)return;
    const d=Cal.diffDays(today,tk.due);
    if(d<0){const k='over:'+tk.id+':'+tk.due;if(!db.notifs.some(n=>n.userId===u.id&&n.key===k)){notify(u.id,{type:'due',key:k,link:'task:'+tk.id,text:'n.overdue',params:{t:tk.title}});ch=true}}
    else if(d<=1){const k='soon:'+tk.id+':'+tk.due;if(!db.notifs.some(n=>n.userId===u.id&&n.key===k)){notify(u.id,{type:'due',key:k,link:'task:'+tk.id,text:d===0?'n.dueToday':'n.dueTomorrow',params:{t:tk.title}});ch=true}}
  });
  if(ch)save();
}
function normalizeOrder(pid,status){ // keep orders unique & tidy
  projTasks(pid).filter(x=>x.status===status).sort((a,b)=>a.order-b.order).forEach((x,i)=>x.order=i+1);
}
function nextOrder(pid,status){const o=projTasks(pid).filter(x=>x.status===status).map(x=>x.order||0);return (o.length?Math.max(...o):0)+1}
const taskDueState=tk=>{if(!tk.due||tk.status==='done')return '';const d=Cal.diffDays(Cal.todayISO(),tk.due);return d<0?'over':d===0?'today':''};
const statusColor=s=>`var(--s-${s})`;
const prioIcon=p=>({low:'chd',medium:'dots',high:'flag',urgent:'alert'})[p]||'flag';

function uiSet(k,v){try{localStorage.setItem('vedilm_ui_'+k,v)}catch(e){}}

'faq.a1':['استارتاپ‌ها، آژانس‌ها، تیم‌های محصول و تیم‌های دورکار که پروژه و وظیفه‌هایشان را در یک جا می‌خواهند.','Startups, agencies, product teams and remote teams that want projects and tasks in one place.','الشركات الناشئة والوكالات وفرق المنتجات والفرق عن بعد.','需要把项目和任务集中管理的初创公司、代理机构、产品团队和远程团队。'],
'faq.q2':['داده‌های من کجا ذخیره می‌شود؟','Where is my data stored?','أين تُحفظ بياناتي؟','我的数据存储在哪里？'],

'faq.q4':['اگر رمزم را فراموش کنم چه کنم؟','What if I forget my password?','ماذا لو نسيت كلمة المرور؟','忘记密码怎么办？'],

let LANG=uiGet('lang','fa');if(!['fa','en','ar','zh'].includes(LANG))LANG='fa';
const LANGIDX={fa:0,en:1,ar:2,zh:3};
const LOC={fa:'fa-IR',en:'en-US',ar:'ar',zh:'zh-CN'};
function t(key,p){
  const e=DICT[key];let s;
  if(!e)return key;
  s=e[LANGIDX[LANG]];if(s==null||s==='')s=e[1];
  if(p)s=s.replace(/\{(\w+)\}/g,(m,k)=>p[k]!=null?p[k]:m);
  return s;
}
const num=n=>{n=String(n);return LANG==='fa'?n.replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]):n};
function applyLang(){
  document.documentElement.lang=LANG;document.documentElement.dir=(LANG==='fa'||LANG==='ar')?'rtl':'ltr';
}

/* ---------- date formatting ---------- */
const FA_J_MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
function monthName(sys,m,jy){
  if(sys==='g')return new Intl.DateTimeFormat(LOC[LANG]+'-u-ca-gregory',{month:'long',timeZone:'UTC'}).format(Date.UTC(2001,m-1,15));
  if(LANG==='fa')return FA_J_MONTHS[m-1];
  const g=Cal.fromJ(jy||1405,m,15),p=Cal.parse(g);
  return new Intl.DateTimeFormat(LOC[LANG]+'-u-ca-persian',{month:'long',timeZone:'UTC'}).format(Date.UTC(p.y,p.m-1,p.d));
}
function weekdayNames(){ // index 0=Sunday
  const L=[],S=[];
  for(let i=0;i<7;i++){
    const d=Date.UTC(2023,0,1+i); // 2023-01-01 is Sunday
    L.push(new Intl.DateTimeFormat(LOC[LANG],{weekday:'long',timeZone:'UTC'}).format(d));
    S.push(LANG==='fa'?['ی','د','س','چ','پ','ج','ش'][i]:new Intl.DateTimeFormat(LOC[LANG],{weekday:LANG==='zh'?'short':'narrow',timeZone:'UTC'}).format(d));
  }
  return{long:L,short:S};
}
function fmtDate(iso,sys,style='long'){
  if(!iso)return '';
  const s=sys||calSys();
  const v=Cal.ymOf(s,iso);
  if(style==='md')return num(v.d)+' '+monthName(s,v.m,v.y);
  if(style==='ym')return monthName(s,v.m,v.y)+' '+num(v.y);
  return num(v.d)+' '+monthName(s,v.m,v.y)+' '+num(v.y);
}
function fmtDual(iso){const a=calSys(),b=a==='j'?'g':'j';return fmtDate(iso,a)+' <span class="muted xs">('+fmtDate(iso,b)+')</span>'}
function fmtTime(tm){return tm?num(tm):''}
function relDay(iso){
  const d=Cal.diffDays(Cal.todayISO(),iso);
  if(d===0)return t('d.today');if(d===1)return t('d.tomorrow');if(d===-1)return t('d.yesterday');
  return d>0?t('d.inDays',{n:num(d)}):t('d.daysAgo',{n:num(-d)});
}
function fmtAgo(isoTs){
  const s=Math.max(0,(Date.now()-new Date(isoTs).getTime())/1000);
  if(s<60)return t('ago.now');if(s<3600)return t('ago.m',{n:num(Math.floor(s/60))});
  if(s<86400)return t('ago.h',{n:num(Math.floor(s/3600))});if(s<86400*30)return t('ago.d',{n:num(Math.floor(s/86400))});
  return fmtDate(isoTs.slice(0,10));
}
function calSys(){const p=prefs().calSys;return p||(LANG==='fa'?'j':'g')}
function weekStart(){const w=prefs().weekStart;if(w==='sat')return 6;if(w==='sun')return 0;if(w==='mon')return 1;return calSys()==='j'?6:(LANG==='ar'?6:0)}

let toastTimer=null;
function toast(msg,undo){
  let box=$('#toasts');if(!box){box=document.createElement('div');box.id='toasts';box.className='toasts';box.setAttribute('role','status');box.setAttribute('aria-live','polite');document.body.appendChild(box)}
  const el=document.createElement('div');el.className='toast';
  el.innerHTML=`<span>${esc(msg)}</span>${undo?`<button type="button">${esc(t('undo'))}</button>`:''}`;
  box.appendChild(el);

  if(undo)el.querySelector('button').onclick=()=>{undo();kill()};
  setTimeout(kill,undo?6500:3200);
}

/* ---------- overlays ---------- */
const ovStack=[];
function openOverlay(html,opts={}){
  const root=$('#ov')||(()=>{const d=document.createElement('div');d.id='ov';document.body.appendChild(d);return d})();
  const wrap=document.createElement('div');wrap.className='ov';wrap.innerHTML=html;
  wrap._opener=document.activeElement;wrap._onClose=opts.onClose;wrap._persist=opts.persist;
  wrap.addEventListener('mousedown',e=>{if(e.target===wrap&&!opts.sticky)closeOverlay(wrap)});
  root.appendChild(wrap);ovStack.push(wrap);document.body.style.overflow='hidden';
  const f=opts.focus?wrap.querySelector(opts.focus):wrap.querySelector('input:not([type=hidden]),textarea,select,button.primary');
  setTimeout(()=>{(f||wrap.querySelector('button'))?.focus?.()},30);
  return wrap;
}
function closeOverlay(w){
  w=w||ovStack[ovStack.length-1];if(!w)return;
  const i=ovStack.indexOf(w);if(i>=0)ovStack.splice(i,1);
  w.remove();if(!ovStack.length)document.body.style.overflow='';
  try{w._onClose&&w._onClose()}catch(e){}
  try{w._opener&&document.contains(w._opener)&&w._opener.focus()}catch(e){}
  if(!ovStack.length&&pendingSync){pendingSync=false;if(SRV.on)render();else{db=loadDB();render()}}
}
function closeAllOverlays(){while(ovStack.length)closeOverlay()}
let pendingSync=false;
document.addEventListener('keydown',e=>{
  const top=ovStack[ovStack.length-1];if(!top)return;
  if(e.key==='Escape'){e.preventDefault();if(DP){dpClose();return}if($('#menu')){closeMenu();return}closeOverlay(top);return}
  if(e.key==='Tab'){
    const f=[...top.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]):not([type=hidden]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')].filter(x=>x.offsetParent!==null);
    if(!f.length)return;const a=f[0],b=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();b.focus()}
    else if(!e.shiftKey&&document.activeElement===b){e.preventDefault();a.focus()}
  }
});
function modalShell({title,body,footer='',cls='',closeLabel}){
  return `<div class="modal ${cls}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="mh"><h2>${esc(title)}</h2><button type="button" class="icon-btn" data-act="close-ov" aria-label="${esc(t('close'))}">${ic('x')}</button></div><div class="mb">${body}</div>${footer?`<div class="mf">${footer}</div>`:''}</div>`;

function confirmDialog({title,text,ok,danger=true}){
  return new Promise(res=>{
    let done=false;const fin=v=>{if(done)return;done=true;res(v)};
    const w=openOverlay(`<div class="modal sm" role="alertdialog" aria-modal="true"><div class="mb" style="padding-top:24px"><h2 style="font-size:18px;margin-bottom:8px">${esc(title)}</h2><p class="muted">${esc(text||'')}</p></div><div class="mf" style="border:0"><button type="button" class="btn" data-cf="0">${esc(t('cancel'))}</button><button type="button" class="btn ${danger?'danger':'primary'}" data-cf="1">${esc(ok||t('confirm'))}</button></div></div>`,{onClose:()=>fin(false),focus:'[data-cf="0"]'});
    w.addEventListener('click',e=>{const b=e.target.closest('[data-cf]');if(!b)return;fin(b.dataset.cf==='1');closeOverlay(w)});

function dpClose(){if(DP){DP.pop?.remove();DP=null}}
function dpOpen(wrap){
  dpClose();
  const inp=wrap.querySelector('[data-dpval]'),val=inp.value||'';
  const sys=calSys();const base=val||Cal.todayISO();const v=Cal.ymOf(sys,base);
  DP={wrap,sys,y:v.y,m:v.m,value:val};
  const pop=document.createElement('div');pop.className='dp-pop';DP.pop=pop;pop.style.position='fixed';

function dpPlace(){
  if(!DP)return;const pop=DP.pop,b=DP.wrap.querySelector('button').getBoundingClientRect(),w=pop.offsetWidth,h=pop.offsetHeight;
  let left=document.documentElement.dir==='rtl'?b.right-w:b.left;left=clamp(left,8,innerWidth-w-8);
  let top=b.bottom+6;if(top+h>innerHeight-8)top=Math.max(8,b.top-h-6);
  pop.style.left=left+'px';pop.style.top=top+'px';

function dpRender(){
  if(!DP)return;
  const {sys,y,m,value}=DP,R=Cal.range(sys),today=Cal.todayISO();
  const wd=weekdayNames(),ws=weekStart();
  const grid=Cal.monthGrid(sys,y,m,ws);
  const minY=Math.min(R.minYM.y,value?Cal.ymOf(sys,value).y:9999),maxY=Math.max(R.maxYM.y,value?Cal.ymOf(sys,value).y:0);
  let years='';for(let i=minY;i<=maxY;i++)years+=`<option value="${i}" ${i===y?'selected':''}>${num(i)}</option>`;
  let months='';for(let i=1;i<=12;i++)months+=`<option value="${i}" ${i===m?'selected':''}>${esc(monthName(sys,i,y))}</option>`;
  const names=[];for(let i=0;i<7;i++)names.push(wd.short[(ws+i)%7]);
  const min=value&&value<R.min?value:R.min,max=value&&value>R.max?value:R.max;
  let cells='';grid.forEach(w=>w.forEach(c=>{
    const d=Cal.ymOf(sys,c.iso).d,dis=c.iso<min||c.iso>max;
    cells+=`<button type="button" class="${c.inMonth?'':'o'} ${c.iso===today?'t':''} ${c.iso===value?'s':''}" data-act="dp-pick" data-iso="${c.iso}" ${dis?'disabled':''} aria-label="${esc(fmtDate(c.iso))}">${num(d)}</button>`;
  }));
  DP.pop.innerHTML=`<div class="dp-h"><button type="button" class="icon-btn" data-act="dp-nav" data-d="-1" aria-label="${esc(t('prev'))}">${ic('chl','flip')}</button><select class="select sel" data-dpsel="m" aria-label="${esc(t('month'))}">${months}</select><select class="select sel" data-dpsel="y" aria-label="${esc(t('year'))}">${years}</select><button type="button" class="icon-btn" data-act="dp-nav" data-d="1" aria-label="${esc(t('next'))}">${ic('chr','flip')}</button></div>
  <div class="seg" style="margin-bottom:8px;width:100%"><button type="button" style="flex:1;justify-content:center" aria-pressed="${sys==='j'}" data-act="dp-sys" data-sys="j">${esc(t('cal.j'))}</button><button type="button" style="flex:1;justify-content:center" aria-pressed="${sys==='g'}" data-act="dp-sys" data-sys="g">${esc(t('cal.g'))}</button></div>
  <div class="dp-g">${names.map(n=>`<b>${esc(n)}</b>`).join('')}${cells}</div>
  <div class="dp-f"><button type="button" class="btn ghost sm" data-act="dp-pick" data-iso="${today}">${esc(t('d.today'))}</button>${DP.wrap.querySelector('[data-dpval]').value?`<button type="button" class="btn ghost sm" data-act="dp-pick" data-iso="">${esc(t('clear'))}</button>`:''}</div>`;
}

}

const COLS=['users','invites','projects','tasks','events','notifs','activity','messages'];
const SRV={on:false,cid:uid('c_'),online:new Set(),base:null,ver:0,flushing:false,again:false,timer:null,abort:null,conn:'ok',rx:0,found:{}};
const TK='vedilm_tok';
function getTok(){try{return sessionStorage.getItem(TK)||localStorage.getItem(TK)||''}catch(e){return ''}}
function setTok(v,remember){try{sessionStorage.setItem(TK,v);if(remember)localStorage.setItem(TK,v);else localStorage.removeItem(TK)}catch(e){}}
function clearTok(){try{sessionStorage.removeItem(TK);localStorage.removeItem(TK)}catch(e){}}

async function api(method,path,body,opt={}){
  const h={};const tok=getTok();if(tok)h.Authorization='Bearer '+tok;if(body!==undefined)h['Content-Type']='application/json';
  try{
    const r=await fetch(path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body),keepalive:!!opt.keepalive});
    let data=null;try{data=await r.json()}catch(e){}
    if(r.status===401&&tok&&!opt.noAuthRedirect&&path!=='/api/login')srvExpired();
    return{ok:r.ok,status:r.status,data:data||{}};
  }catch(e){return{ok:false,status:0,data:{}}}
}
async function detectServer(){
  if(!/^https?:$/.test(location.protocol))return false;
  try{
    const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),2500);
    const r=await fetch('/api/health',{signal:ac.signal,cache:'no-store'});clearTimeout(tm);
    const d=await r.json();SRV.mail=!!(d&&d.mail);SRV.invite=!!(d&&d.invite);return !!(d&&d.app==='vedilm');
  }catch(e){return false}
}

      if(c==='users'&&o.id!==uidv)continue;
      m[c][o.id]=JSON.stringify(o);
    }
  }
  return m;
}
function computeChanges(){
  const ch={},sent={},sentDel={};let any=false;
  const uidv=myId();
  for(const c of COLS){
    const base=SRV.base[c]||{},up=[],del=[];sent[c]={};sentDel[c]=new Set();
    const seen=new Set();
    for(const o of db[c]){
      if(c==='users'&&o.id!==uidv)continue;
      seen.add(o.id);
      const js=JSON.stringify(o),b=base[o.id];
      if(b===js)continue;
      if(b===undefined){up.push(c==='activity'||c==='notifs'?{id:o.id,full:o}:{id:o.id,full:o})}
      else{
        const bo=JSON.parse(b),patch={};
        for(const k of Object.keys(o))if(JSON.stringify(o[k])!==JSON.stringify(bo[k]))patch[k]=o[k];
        if(!Object.keys(patch).length)continue;
        up.push({id:o.id,patch});
      }
      sent[c][o.id]=js;
    }
    if(c!=='users'&&c!=='activity')for(const id of Object.keys(base))if(!seen.has(id)){if(c==='notifs'){const bo=JSON.parse(base[id]);if(bo.userId!==uidv)continue}if(c==='messages'){const bo=JSON.parse(base[id]);if(bo.fromId!==uidv)continue}del.push(id);sentDel[c].add(id)}
    if(up.length||del.length){ch[c]={up,del};any=true}
  }
  return{changes:ch,sent,sentDel,any};
}
function srvDirty(){return !!SRV.base&&computeChanges().any}
function scheduleFlush(ms=250){clearTimeout(SRV.timer);SRV.timer=setTimeout(flush,ms)}
async function flush(){
  if(!SRV.on||!getTok()||!SRV.base)return;
  if(SRV.flushing){SRV.again=true;return}
  const ch=computeChanges();if(!ch.any)return;
  SRV.flushing=true;const ver=SRV.ver;
  try{
    const r=await api('POST','/api/sync',{cid:SRV.cid,changes:ch.changes});
    if(r.ok){setConn('ok');reconcile(r.data.state,ch);afterReconcile()}
    else if(r.status===0||r.status>=500){setConn('off');SRV.again=false;scheduleFlush(3000)}
    else if(r.status===401){/* handled */}
    else{ // client error: resync from server so local garbage is dropped
      SRV.flushing=false;await pullState(true);
    }
  }catch(e){setConn('off');scheduleFlush(3000)}
  SRV.flushing=false;
  if(SRV.again||SRV.ver!==ver){SRV.again=false;scheduleFlush(50)}
}

/* ----- three-way reconcile (object level) ----- */
function replaceInPlace(dst,src){for(const k of Object.keys(dst))delete dst[k];Object.assign(dst,JSON.parse(JSON.stringify(src)))}
function reconcile(st,ch){
  const old=SRV.base||{},uidv=st.me||myId();
  const prevUnread=new Set((db.notifs||[]).filter(n=>n.userId===uidv&&!n.read).map(n=>n.id));
  for(const c of COLS){
    const srv=st[c]||[],oldB=old[c]||{},sm=(ch&&ch.sent[c])||{},sd=(ch&&ch.sentDel[c])||new Set();
    const local=db[c]||[],byId=new Map(local.map(o=>[o.id,o])),srvIds=new Set(srv.map(o=>o.id)),out=[];
    for(const so of srv){
      const lo=byId.get(so.id);
      if(!lo){
        if(oldB[so.id]===undefined||sd.has(so.id))out.push(JSON.parse(JSON.stringify(so)));   // new from others / delete rejected
        continue;                                                                           // else: deleted locally after flush → keep deleted
      }
      const ljs=JSON.stringify(lo),editing=typeof TM!=='undefined'&&TM&&TM.obj===lo;
      const mine=c==='users'&&so.id!==uidv?false:true;
      if(!editing&&(!mine||ljs===oldB[so.id]||ljs===sm[so.id]))replaceInPlace(lo,so);
      out.push(lo);
    }
    for(const lo of local){
      if(srvIds.has(lo.id))continue;
      if(c==='users')continue;
      const inOld=oldB[lo.id]!==undefined,sentIt=sm[lo.id]!==undefined;
      if(!inOld&&!sentIt)out.push(lo);          // pending local create
    }
    db[c]=out;
  }
  SRV.base=snapMap(st);SRV.plan=st.plan||SRV.plan;
  SRV.online=new Set(st.online||[]);
  // toast for fresh notifications
  const fresh=db.notifs.filter(n=>n.userId===uidv&&!n.read&&!prevUnread.has(n.id)).sort((a,b)=>b.at.localeCompare(a.at));
  if(SRV.loaded&&fresh.length){try{toast(t(fresh[0].text,fresh[0].params||{}))}catch(e){}}
  SRV.loaded=true;
}
function afterReconcile(){
  if(typeof ovStack!=='undefined'&&ovStack.length){pendingSync=true;return}
  const r=parseRoute();if(r.app&&!me()){render();return}
  if(r.app||r.name==='landing')render();
}
async function pullState(force){
  if(!SRV.on||!getTok())return;
  if(SRV.flushing){SRV.again=true;return}
  if(!force&&srvDirty()){flush();return}
  const r=await api('GET','/api/state');
  if(!r.ok){if(r.status===0)setConn('off');return}
  setConn('ok');
  if(SRV.flushing)return;
  reconcile(r.data,null);afterReconcile();
}
function loadState(st){ // hard replace after login / init
  db=emptyDB();for(const c of COLS)db[c]=JSON.parse(JSON.stringify(st[c]||[]));
  SRV.base=snapMap(st);SRV.plan=st.plan||null;SRV.online=new Set(st.online||[]);SRV.loaded=true;
}

/* ----- live stream (SSE over fetch) ----- */
async function connectSSE(){
  if(!SRV.on||!getTok()||SRV.abort)return;
  const ac=new AbortController();SRV.abort=ac;SRV.rx=Date.now();
  const watchdog=setInterval(()=>{if(Date.now()-SRV.rx>50000)ac.abort()},10000);
  try{
    const r=await fetch('/api/events?cid='+encodeURIComponent(SRV.cid),{headers:{Authorization:'Bearer '+getTok()},signal:ac.signal});
    if(r.status===401){clearInterval(watchdog);SRV.abort=null;srvExpired();return}
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
    for(;;){
      const {value,done}=await rd.read();if(done)break;
      SRV.rx=Date.now();buf+=dec.decode(value,{stream:true});
      let i;while((i=buf.indexOf('\n\n'))>=0){const blk=buf.slice(0,i);buf=buf.slice(i+2);onSSE(blk)}
    }
  }catch(e){}
  clearInterval(watchdog);SRV.abort=null;
  if(SRV.on&&getTok()){setConn('off');setTimeout(connectSSE,2500)}
}
function stopSSE(){try{SRV.abort&&SRV.abort.abort()}catch(e){}SRV.abort=null}
function onSSE(blk){
  let ev='message',data='';
  for(const l of blk.split('\n')){if(l.startsWith('event:'))ev=l.slice(6).trim();else if(l.startsWith('data:'))data+=l.slice(5).trim()}
  if(ev==='hello'){setConn('ok');pullState()}
  else if(ev==='changed'){pullState();if(parseRoute().name==='invoices'||INVS.loaded)invLoad();if(RQ.loaded)rqLoad();if(RPT.loaded)rptLoad();if(NDS.loaded)ndLoad();if(parseRoute().name==='timer'||(TMR.sum&&TMR.sum.active))tmSum().then(tmRefresh)}
  else if(ev==='check'||ev==='timer'){tmSum().then(tmRefresh)}
  else if(ev==='presence'){try{SRV.online=new Set(JSON.parse(data).online||[]);if(!ovStack.length&&parseRoute().app)render()}catch(e){}}
}

/* ----- connection badge ----- */
function setConn(s){
  if(SRV.conn===s)return;SRV.conn=s;
  let b=document.getElementById('conn');
  if(s==='ok'){b&&b.remove();return}
  if(!b){b=document.createElement('div');b.id='conn';b.setAttribute('role','status');document.body.appendChild(b)}
  b.textContent=t('srv.offline');
}
function srvExpired(){
  if(!getTok())return;
  clearTok();clearSid();stopSSE();db=emptyDB();SRV.base=null;
  if(parseRoute().app){location.hash='#/login';render();toast(t('srv.expired'))}
}
function srvLogout(){
  if(getTok())api('POST','/api/logout',{},{noAuthRedirect:true});
  clearTok();clearSid();stopSSE();db=emptyDB();SRV.base=null;SRV.online=new Set();setConn('ok');
}
async function srvEnter(data,remember){ // after login / register
  setTok(data.token,remember);setSid(data.uid,remember);
  const r=await api('GET','/api/state');

  connectSSE();
}

async function doReset(form){
  const f=new FormData(form),pw=String(f.get('password')||''),cf=String(f.get('confirm')||'');
  const errs={};if(pw.length<8)errs.password=t('err.pwShort');else if(pw!==cf)errs.confirm=t('err.pwMatch');
  if(Object.keys(errs).length)return setErrs(form,errs);
  const r=await api('POST','/api/reset',{token:parseRoute().id||'',password:pw});
  if(!r.ok)return setErrs(form,{form:srvErr(r)||t('reset.bad')});
  toast(t('pw.reset.ok'));location.hash='#/login';
}
/* ---------- auth logic ---------- */
const EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
function pwScore(p){let s=0;if(p.length>=8)s++;if(/[a-z]/.test(p)&&/[A-Z]/.test(p))s++;if(/\d/.test(p))s++;if(/[^A-Za-z0-9]/.test(p)||p.length>=12)s++;return p?Math.max(1,s):0}
function setErrs(form,errs){
  $$('[data-msg]',form).forEach(m=>m.textContent='');$$('.input.err',form).forEach(i=>i.classList.remove('err'));
  let first=null;
  for(const [k,v] of Object.entries(errs)){const m=$(`[data-msg="${k}"]`,form);if(m)m.textContent=v;const i=form.elements[k];if(i&&k!=='form'){i.classList.add('err');i.setAttribute('aria-invalid','true');first=first||i}}
  first&&first.focus();
}
async function doLogin(form){
  const f=new FormData(form),email=String(f.get('email')||'').trim().toLowerCase(),pw=String(f.get('password')||'');
  const errs={};if(!EMAIL_RE.test(email))errs.email=t('err.email');if(!pw)errs.password=t('err.required');
  if(Object.keys(errs).length)return setErrs(form,errs);
  if(SRV.on){
    const btn=$('button[type=submit]',form);btn&&(btn.disabled=true);
    const r=await api('POST','/api/login',{email,password:pw,remember:true});btn&&(btn.disabled=false);
    if(!r.ok)return setErrs(form,{form:srvErr(r)||t('err.badLogin')});

async function doRegister(form){
  const f=new FormData(form),name=String(f.get('name')||'').trim(),email=String(f.get('email')||'').trim().toLowerCase(),pw=String(f.get('password')||''),cf=String(f.get('confirm')||''),role=f.get('role')==='employee'?'employee':'manager';
  const errs={};
  if(name.length<2)errs.name=t('err.name');
  if(!EMAIL_RE.test(email))errs.email=t('err.email');
  else if(!SRV.on&&db.users.some(u=>u.email===email))errs.email=t('err.emailTaken');
  if(pw.length<8)errs.password=t('err.pwShort');
  if(!errs.password&&pw!==cf)errs.confirm=t('err.pwMatch');
  if(Object.keys(errs).length)return setErrs(form,errs);
  if(SRV.on){
    const r=await api('POST','/api/register',{name,email,password:pw,role,lang:LANG,invite:String(f.get('invite')||'').trim()});
    if(!r.ok)return setErrs(form,r.data.error==='invite'?{invite:t('err.invite')}:r.data.error==='emailTaken'?{email:t('err.emailTaken')}:{form:srvErr(r)||t('err.generic')});

async function doForgot(form){
  const f=new FormData(form),email=String(f.get('email')||'').trim().toLowerCase(),code=String(f.get('code')||'').trim().toUpperCase().replace(/\s|-/g,''),pw=String(f.get('password')||'');

function filterTasks(list,f){
  let r=list.slice();
  if(f.q)r=r.filter(x=>normQ(x.title+' '+x.desc+' '+x.labels.join(' ')).includes(normQ(f.q)));
  if(f.assignee==='me')r=r.filter(x=>x.assigneeIds.includes(me().id));
  else if(f.assignee==='none')r=r.filter(x=>!x.assigneeIds.length);
  else if(f.assignee&&f.assignee!=='all')r=r.filter(x=>x.assigneeIds.includes(f.assignee));
  if(f.prio&&f.prio!=='all')r=r.filter(x=>x.priority===f.prio);
  return r;
}
function sortTasks(list,mode){
  const r=list.slice();
  if(mode==='due')r.sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')||PRIO_W[a.priority]-PRIO_W[b.priority]);
  else if(mode==='prio')r.sort((a,b)=>PRIO_W[a.priority]-PRIO_W[b.priority]||(a.due||'9999').localeCompare(b.due||'9999'));
  else if(mode==='new')r.sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  else r.sort((a,b)=>a.order-b.order);
  return r;
}

function viewTasks(){
  const f=ui.mt,today=Cal.todayISO();

  const openL=list.filter(x=>x.status!=='done'),doneL=list.filter(x=>x.status==='done');

  const groups=[['over',openL.filter(x=>x.due&&x.due<today)],['today',openL.filter(x=>x.due===today)],['week',openL.filter(x=>x.due>today&&x.due<=week)],['later',openL.filter(x=>x.due>week)],['nodate',openL.filter(x=>!x.due)]];
  const sortD=a=>a.sort((x,y)=>(x.due||'').localeCompare(y.due||'')||PRIO_W[x.priority]-PRIO_W[y.priority]);
  const show=f.status==='done'?[['done',doneL]]:f.status==='all'?[...groups,['done',doneL]]:groups;

    <select class="select" data-ch="mt-project" aria-label="${esc(t('task.project'))}"><option value="all">${esc(t('f.allProjects'))}</option>${visProjects().map(p=>`<option value="${p.id}" ${f.project===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>

  const blocks=show.filter(([,l])=>l.length).map(([k,l])=>`<section class="card" style="margin-bottom:14px;padding:14px 18px"><div class="card-h" style="margin-bottom:6px"><h3 style="${k==='over'?'color:var(--bad)':''}">${esc(t('grp.'+k))} <span class="muted small">${num(l.length)}</span></h3></div><div class="list">${sortD(l).map(tk=>taskRow(tk,{showProject:true})).join('')}</div></section>`).join('');

function submitProject(form){
  const f=new FormData(form),name=String(f.get('name')||'').trim(),id=form.dataset.id;
  if(!name)return setErrs(form,{name:t('err.required')});
  const ids=f.getAll('member').map(String).filter(x=>userById(x));
  const members=ids.map(x=>({userId:x,title:String(f.get('mt_'+x)||'').trim()}));
  const topic=String(f.get('topic')||''),siteUrl=topic==='web'?String(f.get('siteUrl')||'').trim():'';
  if(siteUrl&&!/^https?:\/\/[^\s<>"']{3,290}$/i.test(siteUrl))return setErrs(form,{siteUrl:t('site.err')});
  const base={topic,siteUrl,name,desc:String(f.get('desc')||'').trim(),color:String(f.get('color')||PCOLORS[0]),due:String(f.get('due')||''),members};
  if(id){
    const p=projById(id);if(!p||!canEditProject(p))return;
    const added=ids.filter(x=>!p.members.some(m=>m.userId===x));
    Object.assign(p,base);
    // unassign removed members from tasks
    db.tasks.forEach(tk=>{if(tk.projectId===p.id)tk.assigneeIds=tk.assigneeIds.filter(a=>a===p.ownerId||ids.includes(a))});
    added.forEach(a=>notify(a,{type:'assigned',text:'n.addedProject',params:{p:p.name},link:'project:'+p.id}));
    logAct(p.id,actRaw('act.projUpdated'));save();closeAllOverlays();toast(t('saved'));render();
  }else{
    const p=Object.assign({id:uid('p_'),ownerId:me().id,createdAt:nowISO()},base);
    db.projects.push(p);ids.forEach(a=>notify(a,{type:'assigned',text:'n.addedProject',params:{p:p.name},link:'project:'+p.id}));
    logAct(p.id,actRaw('act.projCreated'));save();closeAllOverlays();toast(t('proj.created'));location.hash='#/app/project/'+p.id;
  }
}
async function deleteProject(id){

/* ---------- timeline (gantt) ---------- */
function timelineHTML(all){
  const today=Cal.todayISO(),W=30;
  const items=all.filter(x=>x.due||x.start).map(x=>{
    const e=x.due||x.start,c=(x.createdAt||'').slice(0,10);
    const s=x.start&&x.start<=e?x.start:(c&&c<=e&&Cal.diffDays(c,e)<=60?c:e);
    return{tk:x,s,e};
  }).sort((a,b)=>a.s.localeCompare(b.s)||a.e.localeCompare(b.e));
  if(!items.length)return emptyState('cal',t('tl.empty'),t('tl.empty.d'));
  let min=items.reduce((m,i)=>i.s<m?i.s:m,today),max=items.reduce((m,i)=>i.e>m?i.e:m,today);
  min=Cal.addDays(min,-2);max=Cal.addDays(max,3);
  if(Cal.diffDays(min,max)>240)min=Cal.addDays(max,-240);
  const n=Cal.diffDays(min,max)+1,sys=calSys();
  const off=iso=>Cal.diffDays(min,iso)*W;
  let head='';
  for(let i=0;i<n;i++){const d=Cal.addDays(min,i),dw=Cal.dow(d);const isFirst=sys==='j'?Cal.toJ(d).d===1:Cal.parse(d).d===1;if(isFirst||i%7===0||i===0)head+=`<span class="tl-tick" style="inset-inline-start:${i*W}px">${esc(fmtDate(d,sys,'md'))}</span>`}
  const rows=items.map(({tk,s,e})=>{
    const l=off(Cal.diffDays(min,s)<0?min:s),w=Math.max(W-4,(Math.max(0,Cal.diffDays(s,e))+1)*W-4);
    const ov=taskDueState(tk)==='over';
    return `<div class="tl-row"><button type="button" class="tl-name" data-act="open-task" data-id="${tk.id}" title="${esc(tk.title)}"><span class="dot" style="color:${statusColor(tk.status)}"></span><span class="tl-t ${tk.status==='done'?'done':''}">${esc(tk.title)}</span></button><div class="tl-track"><button type="button" class="tl-bar ${ov?'over':''} s-${tk.status}" data-act="open-task" data-id="${tk.id}" style="inset-inline-start:${l}px;width:${w}px" aria-label="${esc(tk.title)}">${tk.assigneeIds.length?avatarStack(tk.assigneeIds,2):''}</button></div></div>`;
  }).join('');
  const tx=off(today)+W/2;
  return `<div class="card tl-card"><div class="tl-scroll"><div class="tl" style="--w:${W}px;--n:${n}"><div class="tl-row tl-hd"><div class="tl-name"></div><div class="tl-track" style="height:28px">${head}</div></div><div class="tl-body">${rows}<span class="tl-today" style="inset-inline-start:calc(var(--namew) + ${tx}px)" title="${esc(t('d.today'))}"></span></div></div></div></div>`;
}

function donutBlock(segs){

  let off=0;

  return `<div class="donut-wrap"><svg viewBox="0 0 120 120" width="132" height="132" role="img" aria-label="${esc(segs.map(s=>s.label+' '+num(s.n)).join(', '))}">${arcs}<text x="60" y="58" text-anchor="middle" style="font-size:22px;font-weight:800;fill:var(--ink)">${num(total)}</text><text x="60" y="74" text-anchor="middle" style="font-size:10px;fill:var(--muted)">${esc(t('tasks.word'))}</text></svg>
  <div style="display:grid;gap:7px">${segs.map(s=>`<div class="lg-i"><i style="background:${s.color}"></i><span>${esc(s.label)}</span><b style="margin-inline-start:auto;padding-inline-start:14px">${num(s.n)}</b></div>`).join('')}</div></div>`;
}
function weeklyChart(counts,labels){
  const W=420,H=170,pl=26,pb=26,pt=10,n=counts.length,max=Math.max(4,...counts),step=Math.ceil(max/4),top=step*4;
  const bw=(W-pl)/n,bar=Math.min(30,bw*.6);
  let g='';for(let i=0;i<=4;i++){const y=pt+(H-pt-pb)*(1-i/4);g+=`<line class="gl" x1="${pl}" x2="${W}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${num(i*step)}</text>`}

}

let invTimer=null;
function codeNorm(q){return String(q||'').replace(/[۰-۹]/g,c=>String(c.charCodeAt(0)-1776)).replace(/[٠-٩]/g,c=>String(c.charCodeAt(0)-1632)).replace(/\D/g,'')}
function renderInviteResults(w,q){
  const u=me(),nq=normQ(q.trim());
  const paint=list=>{$('#iresults',w).innerHTML=list.length?list.map(x=>`<button type="button" class="li click" style="width:100%;text-align:start;border-radius:10px;padding-inline:8px" data-act="invite-pick" data-id="${x.id}" aria-pressed="${w._sel===x.id}">${avatar(x.id)}<span class="grow"><b>${esc(x.name)}</b><span class="xs muted" style="display:block"><bdi>${esc(x.email)}</bdi></span></span><span class="badge ${x.role==='manager'?'primary':''}">${esc(t('role.'+x.role))}</span>${w._sel===x.id?ic('check','sm'):''}</button>`).join(''):`<p class="muted small">${esc(nq?t('team.noUsers'):t('team.noOthers'))}</p>`};
  if(SRV.on){
    const cq=codeNorm(q);paint(Object.values(SRV.found).filter(x=>x.id!==u.id&&!inviteStatusOf(x.id)&&cq.length>=6&&x.code===cq));
    clearTimeout(invTimer);
    invTimer=setTimeout(async()=>{const r=await api('GET','/api/users/search?q='+encodeURIComponent(q.trim()));if(!r.ok||!w.isConnected)return;r.data.users.forEach(x=>SRV.found[x.id]=x);paint(r.data.users.filter(x=>!inviteStatusOf(x.id)))},q?200:0);

}
async function removeMember(otherId){
  const u=me(),o=userById(otherId);if(!o)return;

    if(p.ownerId===u.id){p.members=p.members.filter(m=>m.userId!==otherId);db.tasks.forEach(tk=>{if(tk.projectId===p.id)tk.assigneeIds=tk.assigneeIds.filter(a=>a!==otherId)})}

function reportScope(){

function viewReports(){
  const {projs,tasks}=reportScope(),today=Cal.todayISO();
  const head=pageHead(t('nav.reports'),t('rep.sub'),`<button class="btn" data-act="export-csv">${ic('dl','sm')}${esc(t('rep.csv'))}</button><button class="btn" data-act="print">${esc(t('rep.print'))}</button>`);
  if(!visProjects().length)return head+emptyState('chart',t('rep.empty'),t('rep.empty.d'));
  const done=tasks.filter(x=>x.status==='done'),open=tasks.filter(x=>x.status!=='done'),over=open.filter(x=>x.due&&x.due<today);
  const doneDue=done.filter(x=>x.due&&x.completedAt),onTime=doneDue.filter(x=>x.completedAt.slice(0,10)<=x.due).length;
  const rate=tasks.length?Math.round(done.length/tasks.length*100):0,ot=doneDue.length?Math.round(onTime/doneDue.length*100):null;
  const stats=[['tasks',t('rep.total'),num(tasks.length)],['check',t('rep.rate'),num(rate)+'%'],['clock',t('rep.onTime'),ot==null?'—':num(ot)+'%'],['alert',t('stat.over'),num(over.length)]].map(([i,l,v])=>`<div class="card stat"><small>${ic(i,'sm')}${esc(l)}</small><b>${v}</b></div>`).join('');
  const segs=STATUSES.map(s=>({label:t('st.'+s),n:tasks.filter(x=>x.status===s).length,color:statusColor(s)}));
  // weekly completed (8 weeks)
  const counts=[],labels=[];for(let i=7;i>=0;i--){const end=Cal.addDays(today,-i*7),start=Cal.addDays(end,-6);counts.push(done.filter(x=>{const d=(x.completedAt||'').slice(0,10);return d>=start&&d<=end}).length);labels.push(fmtDate(start,calSys(),'md'))}
  // workload
  const mem=new Map();tasks.forEach(tk=>tk.assigneeIds.forEach(a=>{const r=mem.get(a)||{open:0,done:0,over:0};tk.status==='done'?r.done++:r.open++;if(tk.status!=='done'&&tk.due&&tk.due<today)r.over++;mem.set(a,r)}));
  const rows=[...mem.entries()].sort((a,b)=>(b[1].open+b[1].done)-(a[1].open+a[1].done));
  const maxW=Math.max(1,...rows.map(([,r])=>r.open+r.done));
  const work=rows.length?rows.map(([a,r])=>`<div class="bar-h"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(uname(a))}</span><div style="display:flex;gap:2px;height:10px"><span style="width:${r.done/maxW*100}%;background:var(--s-done);border-radius:5px" data-tip="${esc(t('st.done')+': '+num(r.done))}"></span><span style="width:${r.open/maxW*100}%;background:var(--s-doing);border-radius:5px" data-tip="${esc(t('rep.open')+': '+num(r.open))}"></span></div><b>${num(r.open+r.done)}</b></div>`).join('')+`<div class="legend"><span><i style="--c:var(--s-done)"></i>${esc(t('st.done'))}</span><span><i style="--c:var(--s-doing)"></i>${esc(t('rep.open'))}</span></div>`:`<p class="muted">${esc(t('rep.noAssign'))}</p>`;
  const progs=projs.map(p=>{const pr=progressOf(p.id);return `<div class="bar-h"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}</span><div class="progress" data-tip="${esc(p.name+': '+num(pr)+'%')}"><i style="width:${pr}%;background:${p.color}"></i></div><b>${num(pr)}%</b></div>`}).join('');
  const tbl=rows.length?`<div class="scroll-x"><table class="tbl"><thead><tr><th>${esc(t('rep.member'))}</th><th>${esc(t('rep.open'))}</th><th>${esc(t('st.done'))}</th><th>${esc(t('stat.over'))}</th></tr></thead><tbody>${rows.map(([a,r])=>`<tr><td>${esc(uname(a))}</td><td>${num(r.open)}</td><td>${num(r.done)}</td><td ${r.over?'style="color:var(--bad);font-weight:700"':''}>${num(r.over)}</td></tr>`).join('')}</tbody></table></div>`:'';
  return head+`<div class="tbar noprint"><select class="select" data-ch="rep-project" aria-label="${esc(t('task.project'))}"><option value="all">${esc(t('f.allProjects'))}</option>${visProjects().map(p=>`<option value="${p.id}" ${ui.rep.project===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
  <div class="stats">${stats}</div><div class="grid2" style="gap:16px;margin-bottom:16px"><section class="card"><div class="card-h"><h3>${esc(t('dash.status'))}</h3></div>${donutBlock(segs)}</section><section class="card"><div class="card-h"><h3>${esc(t('rep.weekly'))}</h3></div>${weeklyChart(counts,labels)}</section></div>
  <div class="grid2" style="gap:16px;align-items:start"><section class="card"><div class="card-h"><h3>${esc(t('rep.workload'))}</h3></div>${work}${tbl?`<details style="margin-top:14px"><summary class="small muted" style="cursor:pointer">${esc(t('rep.table'))}</summary>${tbl}</details>`:''}</section><section class="card"><div class="card-h"><h3>${esc(t('rep.projProgress'))}</h3></div>${progs}</section></div>`;
}

async function changePassword(form){

}

}
